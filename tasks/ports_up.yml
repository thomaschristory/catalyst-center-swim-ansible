---
- name: Decide whether the snapshot must be loaded from disk
  ansible.builtin.set_fact:
    snapshot_from_disk: "{{ port_snapshot is not defined }}"

- name: Load the snapshot from disk when not in memory (restore_ports tag)
  when: snapshot_from_disk | bool
  block:
    - name: Snapshot file must exist
      ansible.builtin.stat:
        path: "{{ snapshot_file }}"
      register: restore_stat

    - name: Fail without a snapshot
      ansible.builtin.assert:
        that: restore_stat.stat.exists
        fail_msg: "No snapshot at {{ snapshot_file }}: nothing to restore."
        quiet: true

    - name: Load snapshot
      ansible.builtin.set_fact:
        port_snapshot: "{{ lookup('ansible.builtin.file', snapshot_file) | from_json }}"

- name: Snapshot must belong to this device
  ansible.builtin.assert:
    that: port_snapshot.device_id == device_id
    fail_msg: "Snapshot is for {{ port_snapshot.hostname }}, not {{ catc_device_hostname }}."
    quiet: true

# Interface ids are resolved again by name in case inventory rebuilt them after the reload.
- name: Read interfaces
  ansible.builtin.include_tasks: get_interfaces.yml
  vars:
    ports_to_cycle: "{{ port_snapshot.ports | map(attribute='name') | list }}"

# Only re-enable ports that were UP before the change and are not UP now.
- name: Select ports to enable
  ansible.builtin.set_fact:
    ports_to_enable: >-
      {{ port_snapshot.ports | selectattr('adminStatus', 'equalto', 'UP') | map(attribute='name')
         | reject('in', if_by_name | dict2items | selectattr('value.adminStatus', 'equalto', 'UP')
                         | map(attribute='key') | list)
         | list }}

- name: Enable ports
  cisco.catalystcenter.interface_update:
    interfaceUuid: "{{ if_by_name[item].id }}"
    adminStatus: UP
    deploymentMode: Deploy
  loop: "{{ ports_to_enable }}"
  register: enable_results

- name: Wait for the enable tasks
  ansible.builtin.include_tasks: wait_for_tasks.yml
  vars:
    wait_task_ids: "{{ enable_results.results | map(attribute='catalystcenter_response.response.taskId') | list }}"
  when: ports_to_enable | length > 0

- name: Resync so inventory reflects the change
  cisco.catalystcenter.network_device_sync:
    forceSync: true
    payload:
      - "{{ device_id }}"
  when: ports_to_enable | length > 0

- name: Confirm the ports are admin up
  cisco.catalystcenter.interface_network_device_info:
    deviceId: "{{ device_id }}"
  register: check_up
  until: >-
    check_up.catalystcenter_response.response
    | selectattr('portName', 'in', ports_to_enable)
    | rejectattr('adminStatus', 'equalto', 'UP') | list | length == 0
  retries: "{{ port_state_poll_retries }}"
  delay: "{{ port_state_poll_delay }}"
  when: ports_to_enable | length > 0

- name: Archive the snapshot file
  ansible.builtin.copy:
    src: "{{ snapshot_file }}"
    dest: "{{ playbook_dir }}/snapshots/{{ inventory_hostname }}.restored-{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}.json"
    mode: "0640"
  when: (snapshot_file is file)

- name: Remove the active snapshot file
  ansible.builtin.file:
    path: "{{ snapshot_file }}"
    state: absent
